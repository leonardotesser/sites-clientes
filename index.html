<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Ignis Digital Studio</title>
<style>
  :root{color-scheme:dark light}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    background:#0c0d10;
    color:#eceef1;
    font-family:Georgia,'Times New Roman',serif;
    text-align:center;
  }
  main{max-width:560px}
  h1{
    font-size:clamp(20px,4vw,26px);
    font-weight:400;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#c9a24b;
    margin-bottom:20px;
  }
  p{
    font-size:clamp(15px,2.4vw,17px);
    line-height:1.7;
    color:#b7bac1;
  }
  footer{
    margin-top:40px;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#5a5d66;
  }
</style>
</head>
<body>
  <main>
    <h1>Apresentação personalizada</h1>
    <p>Este ambiente é reservado para projetos desenvolvidos pela Ignis Digital Studio. Utilize o link completo enviado para acessar sua apresentação.</p>
    <footer>Ignis Digital Studio</footer>
  </main>
</body>
</html>
