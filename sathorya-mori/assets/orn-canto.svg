<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 136">
  <!--
    Canto superior esquerdo da moldura do hero, desenhado a partir das
    medidas tiradas de assets/exemplo1.png (1672x941).

    1 unidade = 1 pixel da referencia. A origem (0,0) corresponde ao ponto
    (24,24) da referencia, entao o trilho externo cai em x=1.5 / y=6.5,
    exatamente como no original.

    O ARCO SAIU DE PROPOSITO
    A referencia tem um medalhao em arco com a caveirinha dentro. Ele foi
    removido a pedido: sozinho, sem o resto do medalhao, o arco lia como
    um meio-circulo solto grudado na quina. Ficou so a caveirinha, na
    mesma posicao que ocupava dentro do arco.

    O ramo (volutinha + folha) aparece duas vezes: no trilho de cima e, no
    da esquerda, refletido na diagonal — a matriz (0 1 1 0) troca x por y.
    Na referencia os dois sao um par espelhado. Esta escrito duas vezes em
    vez de <use href="#..."> porque referencia por fragmento dentro de um
    SVG usado como mascara nem sempre resolve.

    Serve como MASCARA: so o canal alfa importa, a cor vem do CSS.
  -->
  <defs>
    <linearGradient id="cauda" gradientUnits="userSpaceOnUse" x1="249" x2="292">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fio" gradientUnits="userSpaceOnUse" x1="70" x2="127">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round">
    <!-- trilho de cima, do canto ate a ponta do dardo -->
    <path d="M1.5 6.5H186"/>
    <!-- trilho da esquerda: so ate onde comeca o trilho solto (local 88) -->
    <path d="M1.5 6.5V88"/>
    <!-- traco curto entre o losango pequeno e o grande -->
    <path d="M209.6 6.5h6"/>
    <!-- losango grande do trilho -->
    <path d="M224 1.6 232 6.5 224 11.4 216 6.5Z" stroke-linejoin="miter"/>
    <!-- cauda fina que se apaga -->
    <path d="M249 6.5H292" stroke="url(#cauda)" stroke-width="1.1"/>
    <!-- fio interno curto que sai da folha de cima e se apaga -->
    <path d="M74 15.5H127" stroke="url(#fio)" stroke-width="1.3"/>
  </g>

  <g fill="#fff">
    <!-- dardo no fim do trilho de cima -->
    <path d="M180 3.4 194 6.5 180 9.6 183.4 6.5Z"/>
    <!-- losangos pequenos -->
    <path d="M206 3.3 209.2 6.5 206 9.7 202.8 6.5Z"/>
    <path d="M240.5 3.3 243.7 6.5 240.5 9.7 237.3 6.5Z"/>
    <!-- olho do losango grande -->
    <path d="M224 4.3 226.2 6.5 224 8.7 221.8 6.5Z"/>

    <!-- caveirinha dentro do arco -->
    <path fill-rule="evenodd" d="M23 19.4c-4.5 0-7.9 3.4-7.9 8v3.9c0 1.7 1 2.9 2.4 3.4v2.2c0 .8.6 1.4 1.4 1.4h8.2c.8 0 1.4-.6 1.4-1.4v-2.2c1.4-.5 2.4-1.7 2.4-3.4v-3.9c0-4.6-3.4-8-7.9-8Zm-4.1 7.6c1.1 0 1.9 1 1.9 2.2s-.8 2.2-1.9 2.2-1.9-1-1.9-2.2.8-2.2 1.9-2.2Zm8.2 0c1.1 0 1.9 1 1.9 2.2s-.8 2.2-1.9 2.2-1.9-1-1.9-2.2.8-2.2 1.9-2.2ZM23 31.7l1.4 2.5h-2.8zm-2.9 3.6h.9v2.7h-.9zm2.5 0h.9v2.7h-.9zm2.5 0h.9v2.7h-.9z"/>
  </g>

  <!-- ramo de cima -->
  <g>
    <path fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"
          d="M62.4 24.4c-5.6-.7-9.4-3.5-9.4-6.5 0-2.4 2.3-3.8 4.2-2.7 1.7 1 1.7 3.3.1 4.4"/>
    <path fill="#fff"
          d="M63 24.4c3.9-.5 7.5-1.4 10.9-2.8 2.6-2.4 5-5.4 7.1-9-3.2 4.9-6.4 8.2-9.4 9.9-2.7.7-5.5 1.3-8.6 1.9Z"/>
  </g>

  <!-- ramo da esquerda: o mesmo, refletido na diagonal -->
  <g transform="translate(-5 9) matrix(0 1 1 0 0 0)">
    <path fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"
          d="M62.4 24.4c-5.6-.7-9.4-3.5-9.4-6.5 0-2.4 2.3-3.8 4.2-2.7 1.7 1 1.7 3.3.1 4.4"/>
    <path fill="#fff"
          d="M63 24.4c3.9-.5 7.5-1.4 10.9-2.8 2.6-2.4 5-5.4 7.1-9-3.2 4.9-6.4 8.2-9.4 9.9-2.7.7-5.5 1.3-8.6 1.9Z"/>
  </g>
</svg>
